<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <script>
    (function() {
      try {
        if (window.visualViewport) {
          var originalViewport = window.visualViewport;
          var proxyViewport = new Proxy(originalViewport, {
            get: function(target, prop, receiver) {
              if (prop === 'height') {
                return Math.min(originalViewport.height, window.innerHeight);
              }
              if (prop === 'width') {
                return Math.min(originalViewport.width, window.innerWidth);
              }
              var value = Reflect.get(target, prop, receiver);
              if (typeof value === 'function') {
                return value.bind(target);
              }
              return value;
            }
          });
          Object.defineProperty(window, 'visualViewport', {
            value: proxyViewport,
            writable: true,
            configurable: true
          });
        }
      } catch (e) {
        console.warn("VisualViewport proxy could not be initialized:", e);
      }
    })();
  </script>

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="aetram">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>aetram</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
